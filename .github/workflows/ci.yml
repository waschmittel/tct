name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the version and components (rustfmt).
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # No --all: that would also format the vendored fork (vendor/).
      - name: cargo fmt --check
        run: cargo fmt --check

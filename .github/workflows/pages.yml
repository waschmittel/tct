name: Pages

# Project website (site/) on GitHub Pages. Needs Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: [site/**, docs/user-guide.md, docs/export-examples/**, docs/vhs/demo.gif, docker/pwa/icon.svg, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MMDR_VERSION: 0.3.1
      MMDR_SHA256: e1da47b758769bff21b82a480fad640a3b893a90fc0dc321551486f8b50c7200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/guide/package-lock.json
      - run: npm ci
        working-directory: site/guide
      # Diagrams: mermaid-rs-renderer (pure Rust, no browser), prebuilt release binary.
      - name: Install mmdr
        run: |
          mkdir -p "$RUNNER_TEMP/mmdr"
          curl -fsSL -o "$RUNNER_TEMP/mmdr.tgz" "https://github.com/1jehuang/mermaid-rs-renderer/releases/download/v$MMDR_VERSION/mmdr-x86_64-unknown-linux-gnu.tar.gz"
          echo "$MMDR_SHA256  $RUNNER_TEMP/mmdr.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mmdr.tgz" -C "$RUNNER_TEMP/mmdr"
      - name: Assemble site
        run: site/build.sh public
        env:
          MMDR: ${{ runner.temp }}/mmdr/mmdr
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Pages

# Project website (site/) on GitHub Pages. Needs Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: [site/**, docs/user-guide.md, docs/export-examples/**, docs/vhs/demo.gif, docker/pwa/icon.svg, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MMDR_VERSION: 0.3.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/guide/package-lock.json
      - run: npm ci
        working-directory: site/guide
      # Diagrams: mermaid-rs-renderer (pure Rust, no browser), built once and cached.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mmdr
        with:
          path: ${{ runner.temp }}/mmdr
          key: mmdr-${{ env.MMDR_VERSION }}-${{ runner.os }}
      - if: steps.mmdr.outputs.cache-hit != 'true'
        run: cargo install mermaid-rs-renderer --version "$MMDR_VERSION" --locked --root "$RUNNER_TEMP/mmdr"
      - name: Assemble site
        run: site/build.sh public
        env:
          MMDR: ${{ runner.temp }}/mmdr/bin/mmdr
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

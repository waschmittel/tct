name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # The project rule is zero warnings; cargo does not apply this to dependencies.
      RUSTFLAGS: -D warnings

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build.rs stamps the version via git describe.
          fetch-depth: 0

      # Install the pinned toolchain minimally and select it via env, so rustup does not
      # re-sync rust-toolchain.toml's components (clippy conflicted with the preinstalled one).
      - name: Install Rust toolchain
        shell: bash
        run: |
          v=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$v" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$v" >> "$GITHUB_ENV"

      - name: Build (debug)
        run: cargo build

      # Debug and release differ in what is compiled (debug assertions), so
      # a warning can hide in either.
      - name: Build (release)
        run: cargo build --release

      - name: Unit and integration tests
        run: cargo test -- --test-threads=1

      - name: Browser (PWA) script tests
        run: node --test docker/pwa/tct-pwa.test.js

      - name: Vendored tui-textarea-2 matches upstream + patch
        if: runner.os == 'Linux'
        run: scripts/vendor-textarea.sh check

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: tct
            label: macos-aarch64
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: tct.exe
            label: windows-amd64
            ext: ".exe"
          # Static musl builds (cross-compiled with zig): no glibc dependency, run on any Linux.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: tct
            label: linux-amd64
            ext: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: tct
            label: linux-arm64
            ext: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need tags so build.rs can stamp the version via git describe.
          fetch-depth: 0

      # Install the pinned toolchain minimally and select it via env, so rustup does not
      # re-sync rust-toolchain.toml's components (clippy conflicted with the preinstalled one).
      - name: Install Rust toolchain
        shell: bash
        run: |
          v=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$v" --profile minimal --target ${{ matrix.target }}
          echo "RUSTUP_TOOLCHAIN=$v" >> "$GITHUB_ENV"

      # zig is the C cross-compiler (psm builds a little C); the PyPI wheel bundles it.
      - name: Install cargo-zigbuild
        if: contains(matrix.target, 'linux-musl')
        run: pip3 install cargo-zigbuild

      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF#refs/tags/}"; v="${v#v}"
          else
            v="snap-$(date -u +%Y-%m-%d)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ${{ contains(matrix.target, 'linux-musl') && 'cargo zigbuild' || 'cargo build' }} --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "tct-${{ steps.ver.outputs.version }}-${{ matrix.label }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tct-${{ steps.ver.outputs.version }}-${{ matrix.label }}${{ matrix.ext }}
          path: tct-${{ steps.ver.outputs.version }}-${{ matrix.label }}${{ matrix.ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/**/*
          generate_release_notes: true

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Rewrite formula and push to tap
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          v="${tag#v}"
          mac="artifacts/tct-$v-macos-aarch64/tct-$v-macos-aarch64"
          lin="artifacts/tct-$v-linux-amd64/tct-$v-linux-amd64"
          mac_sha=$(sha256sum "$mac" | cut -d' ' -f1)
          lin_sha=$(sha256sum "$lin" | cut -d' ' -f1)
          lin_arm="artifacts/tct-$v-linux-arm64/tct-$v-linux-arm64"
          lin_arm_sha=$(sha256sum "$lin_arm" | cut -d' ' -f1)
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tct.git" tap
          cat > tap/Formula/tct.rb <<EOF
          class Tct < Formula
            desc "Terminal Card Tracker - a keyboard-driven TUI Trello clone"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "$v"

            on_macos do
              on_arm do
                url "$base/tct-$v-macos-aarch64"
                sha256 "$mac_sha"
              end
            end

            on_linux do
              on_intel do
                url "$base/tct-$v-linux-amd64"
                sha256 "$lin_sha"
              end
              on_arm do
                url "$base/tct-$v-linux-arm64"
                sha256 "$lin_arm_sha"
              end
            end

            def install
              bin.install Dir["tct-*"].first => "tct"
            end

            test do
              assert_predicate bin/"tct", :executable?
              system bin/"tct", "--help"
            end
          end
          EOF

          cd tap
          if git diff --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update tct to $v"
          git push

  docker:
    name: Publish Docker Image (GHCR)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF#refs/tags/}"
            v_clean="${v#v}"
            echo "tags=${IMAGE}:${v_clean},${IMAGE}:${v},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            v="snap-$(date -u +%Y-%m-%d)"
            echo "tags=${IMAGE}:${v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once for the runner's platform and run it, so a broken image
      # (e.g. files missing from the build context) fails before anything is pushed.
      - name: Build Docker image (smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: tct-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker image (smoke test)
        run: docker run --rm --entrypoint tct tct-smoke --version

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

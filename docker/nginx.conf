# Full nginx config: runs unprivileged (no /var/log, /run or /etc writes; all
# runtime state lives in /tmp/tct, created by entrypoint.sh).
worker_processes 1;
pid /tmp/tct/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/tct/body;
    proxy_temp_path /tmp/tct/proxy;
    fastcgi_temp_path /tmp/tct/fastcgi;
    uwsgi_temp_path /tmp/tct/uwsgi;
    scgi_temp_path /tmp/tct/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7681;
        server_name _;

        root /usr/share/tct-pwa;

        # Applied to `/` and `/ws` + `/token` when opt-in Basic Auth is enabled
        include /tmp/tct/auth.conf;

        # nginx drops server-level add_header once a location sets its own, so
        # every location includes the security headers itself.
        include /etc/nginx/tct-headers.conf;

        location = / {
            include /etc/nginx/tct-headers.conf;
            default_type text/html;
            add_header Cache-Control "no-cache";
            try_files /index.html =404;
        }

        # Static PWA metadata paths are excluded from auth so browser/OS PWA
        # installers and background Service Worker checks never hit 401/302.
        location = /manifest.webmanifest {
            include /etc/nginx/tct-headers.conf;
            auth_basic off;
            default_type application/manifest+json;
            add_header Cache-Control "public, max-age=3600";
            try_files /manifest.webmanifest =404;
        }

        location = /sw.js {
            include /etc/nginx/tct-headers.conf;
            auth_basic off;
            default_type application/javascript;
            add_header Cache-Control "no-cache";
            add_header Service-Worker-Allowed "/";
            try_files /sw.js =404;
        }

        location = /tct-pwa.js {
            include /etc/nginx/tct-headers.conf;
            auth_basic off;
            default_type application/javascript;
            add_header Cache-Control "no-cache";
            try_files /tct-pwa.js =404;
        }

        location = /icon.svg {
            include /etc/nginx/tct-headers.conf;
            auth_basic off;
            default_type image/svg+xml;
            add_header Cache-Control "public, max-age=86400";
            try_files /icon.svg =404;
        }

        location / {
            include /etc/nginx/tct-headers.conf;
            proxy_pass http://127.0.0.1:7682;
            proxy_http_version 1.1;
            # $http_host keeps the port: ttyd's --check-origin compares the
            # browser's Origin with this header.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}

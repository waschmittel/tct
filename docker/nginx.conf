map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 7681;
    server_name _;

    root /usr/share/tct-pwa;

    # Applied to `/` and `/ws` + `/token` when opt-in Basic Auth is enabled
    include /etc/nginx/snippets/tct-auth.conf;

    location = / {
        default_type text/html;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Static PWA metadata paths are excluded from auth so browser/OS PWA
    # installers and background Service Worker checks never hit 401/302.
    location = /manifest.webmanifest {
        auth_basic off;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        try_files /manifest.webmanifest =404;
    }

    location = /sw.js {
        auth_basic off;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files /sw.js =404;
    }

    location = /tct-pwa.js {
        auth_basic off;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=3600";
        try_files /tct-pwa.js =404;
    }

    location = /icon.svg {
        auth_basic off;
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
        try_files /icon.svg =404;
    }

    location / {
        proxy_pass http://127.0.0.1:7682;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

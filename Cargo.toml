[package]
name = "tct"
version = "0.1.0"
edition = "2024"
description = "Terminal Card Tracker - a keyboard-driven TUI Trello clone"
license = "MIT"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
dirs = "7.0"
thiserror = "2.0.21"
# Vendored fork (hanging indent on soft wrap) — see vendor/README.md
tui-textarea-2 = { path = "vendor/tui-textarea-2" }
regex = "1"
arboard = "3.7"
unicode-width = "0.2"
# PDF/A export (embedded DejaVu fonts, validated at finish)
# Language detection of a card for the PDF (quotes, alert titles, fixed texts)
whichlang = "0.1.1"
krilla = { version = "0.8", default-features = false, features = ["simple-text"] }
skrifa = "0.49"
kurbo = { version = "0.13.1", default-features = false, features = ["std"] }

[build-dependencies]
chrono = "0.4"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
